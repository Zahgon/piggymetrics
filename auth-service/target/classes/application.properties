### HTTP -------------------------------------------------------------------
# was: server.port / server.servlet.context-path in shared/auth-service.yml
# the gateway forwards /uaa/** verbatim, so the root path must stay /uaa
quarkus.http.port=5000
quarkus.http.root-path=/uaa
# distinct from the shared 8081 default so parallel module tests do not collide
quarkus.http.test-port=5081

### MongoDB ----------------------------------------------------------------
# was: spring.data.mongodb.* in shared/auth-service.yml
quarkus.mongodb.database=piggymetrics
%prod.quarkus.mongodb.connection-string=mongodb://${MONGODB_USER:user}:${MONGODB_PASSWORD:}@${MONGODB_HOST:auth-mongodb}:${MONGODB_PORT:27017}/piggymetrics
# dev/test: no connection-string configured -> Quarkus Dev Services starts a MongoDB container

### Token issuing ----------------------------------------------------------
# was: the opaque tokens of @EnableAuthorizationServer + InMemoryTokenStore.
# Tokens are now self-contained RS256 JWTs, verifiable via /uaa/.well-known/jwks.json.
piggymetrics.jwt.issuer=${JWT_ISSUER:http://auth-service:5000/uaa}
# DEV-ONLY keypair is committed under src/main/resources/jwt/ - production MUST override
# JWT_PRIVATE_KEY_LOCATION (and JWT_PUBLIC_KEY_LOCATION) with a real, secret key pair.
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:jwt/privateKey.pem}
smallrye.jwt.new-token.issuer=${piggymetrics.jwt.issuer}
smallrye.jwt.new-token.signature-algorithm=RS256

### Token verifying (resource side of POST /uaa/users) ----------------------
# was: @EnableResourceServer on AuthApplication
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:jwt/publicKey.pem}
mp.jwt.verify.issuer=${piggymetrics.jwt.issuer}
# dev and test are fully self-contained: this module signs with the committed private key
# and verifies with the matching public key - no external authorization server involved.

### OAuth2 client secrets --------------------------------------------------
# was: env.getProperty("<SERVICE>_PASSWORD") in OAuth2AuthorizationConfig; compared as
# PLAINTEXT because the original authorization server used NoOpPasswordEncoder.
%test.ACCOUNT_SERVICE_PASSWORD=test-account-secret
%test.STATISTICS_SERVICE_PASSWORD=test-statistics-secret
%test.NOTIFICATION_SERVICE_PASSWORD=test-notification-secret

### Logging ----------------------------------------------------------------
quarkus.log.category."io.quarkus.security".level=INFO
