### HTTP -------------------------------------------------------------------
# was: server.port / server.servlet.context-path in shared/account-service.yml
quarkus.http.port=6000
quarkus.http.root-path=/accounts

### MongoDB ----------------------------------------------------------------
# was: spring.data.mongodb.* in shared/account-service.yml
quarkus.mongodb.database=piggymetrics
%prod.quarkus.mongodb.connection-string=mongodb://${MONGODB_USER:user}:${MONGODB_PASSWORD:}@${MONGODB_HOST:account-mongodb}:${MONGODB_PORT:27017}/piggymetrics
# dev/test: no connection-string configured -> Quarkus Dev Services starts a MongoDB container

### REST clients (replace Feign + Eureka service discovery) -----------------
quarkus.rest-client.auth-service.url=${AUTH_SERVICE_URL:http://auth-service:5000}
quarkus.rest-client.statistics-service.url=${STATISTICS_SERVICE_URL:http://statistics-service:7000}
# unreachable on purpose in tests so the fault-tolerance fallback is exercised
%test.quarkus.rest-client.statistics-service.url=http://localhost:1
%test.quarkus.rest-client.auth-service.url=http://localhost:1

### Fault tolerance (replaces hystrix.command.default.execution.timeout) ----
StatisticsServiceClient/updateStatistics/Timeout/value=10000

### OIDC resource server ---------------------------------------------------
# was: security.oauth2.* (resource user-info-uri + client_credentials client)
# JWKS verification against auth-service (no OIDC discovery doc is served):
# auth-service publishes only /uaa/.well-known/jwks.json, so discovery is disabled and
# the RS256 bearer JWTs are verified directly against that key set + the exact issuer.
# No client secret is needed to verify a bearer token.
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${OAUTH2_AUTH_SERVER_URL:http://auth-service:5000/uaa}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=/.well-known/jwks.json
quarkus.oidc.token.issuer=${OAUTH2_ISSUER:http://auth-service:5000/uaa}
# map the OAuth2 `scope` claim onto Quarkus roles so `hasRole("server")` == hasScope('server')
quarkus.oidc.roles.role-claim-path=scope
quarkus.oidc.roles.role-claim-separator=[\\s,]+
# tests use @TestSecurity-provided identities; no auth server is contacted
%test.quarkus.oidc.enabled=false
%dev.quarkus.oidc.enabled=false

### OIDC client (outbound service-to-service auth) --------------------------
# was: Spring Cloud Security's OAuth2FeignRequestInterceptor + security.oauth2.client.*
# Both S2S rest-clients (AuthServiceClient, StatisticsServiceClient) authenticate AS
# account-service using account-service's own client_credentials, exactly as the Feign
# interceptor did - so a single default oidc-client serves both.
# token-path is relative to auth-server-url -> http://auth-service:5000/uaa/oauth/token
quarkus.oidc-client.auth-server-url=${OAUTH2_AUTH_SERVER_URL:http://auth-service:5000/uaa}
quarkus.oidc-client.discovery-enabled=false
quarkus.oidc-client.token-path=/oauth/token
quarkus.oidc-client.client-id=${OAUTH2_CLIENT_ID:account-service}
quarkus.oidc-client.credentials.secret=${ACCOUNT_SERVICE_PASSWORD:}
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.scopes=server
# tests/dev must stay offline: no token is fetched, so no auth server is contacted
%test.quarkus.oidc-client.enabled=false
%dev.quarkus.oidc-client.enabled=false

### Logging ----------------------------------------------------------------
quarkus.log.category."io.quarkus.security".level=INFO
