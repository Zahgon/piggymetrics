# was: Spring Cloud Config Server @EnableConfigServer, `native` profile
# (spring.cloud.config.server.native.search-locations=classpath:/shared)
# The search location is now served by SharedConfigRepository from the classpath `shared/` directory.

quarkus.http.port=8888
quarkus.http.test-port=8881

# was: SecurityConfig + spring-boot-starter-security
# httpBasic() with the single in-memory user `user` / ${CONFIG_SERVICE_PASSWORD}
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.user=${CONFIG_SERVICE_PASSWORD:}
quarkus.security.users.embedded.roles.user=config-client
quarkus.http.auth.basic=true

# was: .antMatchers("/actuator/**").permitAll()
quarkus.http.auth.permission.health.paths=/q/*
quarkus.http.auth.permission.health.policy=permit

# was: .anyRequest().authenticated()
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Known password so @QuarkusTest can exercise basic auth deterministically.
%test.CONFIG_SERVICE_PASSWORD=test-config-secret
